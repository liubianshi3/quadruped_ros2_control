gait:
  type: "trot"
  period: 1.2
  duty_factor: 0.90
  initial_stand_time: 2.0
  transition_duration: 1.00
  phase_offset:
    FL: 0.0
    RR: 0.0
    FR: 0.5
    RL: 0.5
  min_stance_legs: 2

swing_trajectory:
  type: "cycloid"
  step_height: 0.008
  max_step_height: 0.02
  max_step_length: 0.018
  max_position_delta_per_cycle: 0.004

stance:
  foot_slip_warning_m: 0.01

desired_velocity:
  vx: 0.035
  vy: 0.0
  yaw_rate: 0.0

raibert:
  enabled: true
  k_velocity_x: 0.05
  k_velocity_y: 0.10
  velocity_error_sign: 1
  max_step_length_x: 0.015
  max_step_length_y: 0.010
  max_foot_target_change_per_cycle: 0.004
  use_yaw_correction: false
  k_yaw: 0.02

# Bootstrap walking layer:
# During stance, command the foot target slightly behind the touchdown anchor
# in the body forward direction.  With foot-ground friction this creates the
# first measurable forward ground reaction before the full WBC/MPC stack is
# trusted.  Remove or replace this with WBC once dynamic walking is reliable.
walking_bootstrap:
  enabled: true
  stance_push_gain: 0.45
  max_stance_push_m: 0.018
  stance_push_ramp_time: 0.25
  max_stance_drive_velocity_mps: 0.025
  forward_distance_soft_cap_m: 0.015
  stance_level_pitch_gain: 0.0
  max_stance_level_z_m: 0.004
  min_dynamic_forward_distance_m: 0.02
  validation_duration_s: 6.0
