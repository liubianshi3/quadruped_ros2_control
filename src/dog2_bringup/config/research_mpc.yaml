mpc_node_complete:
  ros__parameters:
    mass: 11.8
    horizon: 10
    dt: 0.05
    control_frequency: 20.0
    mode: hover
    # Stage-1 stand geometry: everything (height target, stance feet for
    # the fz split, posture PD target) must describe the SAME pose. With
    # stance_joint_pose still at the full stance (tibia -1.10) the MPC
    # split front/hind 61.6/38.4 while the stage-1 pose (tibia -1.40)
    # physically loads 34.7/65.3 - a permanent nose-up moment that the
    # attitude support then fought (run22 limit cycle).
    nominal_body_height: 0.20
    stance_joint_pose: [0.0, 0.0, 1.05, -1.40]
    default_stance_length: 0.40
    default_stance_width: 0.30
    enable_sliding_constraints: true
    rail_tracking_error_threshold: 0.020
    support_polygon_margin_threshold: 0.015
    crossing_transition_stable_time: 0.15
    slack_linear_weight: 5000.0
    vertical_support_enabled: true
    # Stage 1 stand target: 0.20 is 3.4 cm above the crouch handoff height
    # (0.166), so the height loop engages with almost no step. Raising to
    # the full 0.26 stance is a later, separate tuning step; run21 showed
    # that asking for 0.26 + stance posture right at handoff turns the
    # rise into a three-loop fight that bounces at h=0.08-0.15.
    vertical_support_target_height: 0.20
    # kp 250 dated from the era when the WBC J^T sign was inverted and most
    # of the commanded force never became support. With foot_force_sign
    # fixed (run28) the same gains launched the trunk: 0.2 m of clamped
    # error commanded 1.5x body weight and the body overshot 0.20 -> 0.33.
    # 120 gives wn = sqrt(kp/m) ~ 3.2 rad/s, gentle enough for the 20 Hz
    # loop + odom latency.
    vertical_support_kp: 120.0
    # Critical damping for kp=120 on 12 kg is 2*sqrt(kp*m) ~ 76; use 60:
    # vz from odom is noisy and arrives at 20 Hz, so heavy kd pumps the
    # loop instead of damping it (run28 rang at fz 48-175 N).
    vertical_support_kd: 60.0
    # 0.6: safety floor for the now-bidirectional height loop -- feet stay
    # loaded (no slip / no full unload) but ascent can actually decelerate.
    # 1.0 turned the regulator one-sided: at/above target it output exactly
    # mg, the trunk coasted upward, unloaded the feet and hopped (run28/29).
    vertical_support_min_total_force_multiplier: 0.6
    # In trot only 2 legs carry the body: per-leg demand is ~64 N plus the
    # attitude-support headroom, so 75 N silently starved the height loop.
    vertical_support_max_leg_force: 95.0
    vertical_support_height_error_limit: 0.12
    # Per-leg UPWARD fz slew limit (N/s): a freshly landed trot pair is
    # loaded over ~0.1 s (inside the duty overlap) instead of a 0->47 N
    # step that hammers the contact and re-excites the diagonal tip each
    # pair transition. Unloading is not limited (the leg lifts anyway).
    # In WALKING the ramp is total-conserving: force held back from a
    # ramping leg is backfilled to other support legs with cap headroom
    # (run64-72: the swallowed shortfall was 18-46% of body weight per
    # pair transition -- the per-stride height bob / 1/3 repeatability).
    vertical_support_load_rate: 500.0
    # Contact reality gate: a scheduled-stance foot whose measured world-z
    # (FK) rides this far above the lowest foot is airborne -- gross tip
    # recovery, leg splayed out of plane -- and gets no support-force
    # budget (run56 turn entry: fz=[67,67,0,0] with rh 0.6 m out of plane
    # -> roll flip). MUST stay well above the trot-rock lever spread
    # (sin(0.3 rad) * 0.28 m ~ 8 cm): at 4 cm the gate kept dropping
    # genuinely planted uphill feet every half cycle, starving both
    # support and the fx budget (run57-62 "anchored in place").
    support_foot_height_gate: 0.12
    hover_force_sanitize_enabled: true
    # At the crouch the hind pair carries 76% of 117.7 N (~44.7 N/leg,
    # up to ~57 N at the measured run28 handoff pose). 72 N keeps the
    # static demand + height-loop increment + attitude delta out of the
    # clamp: an asymmetrically clamped hind pair leaves an unbalanced
    # nose-down moment that pumps pitch into the height bounce.
    hover_force_max_leg_fz: 72.0
    # 4 N: keep a light preload only. 12 N x 4 = 48 N (~40% weight) kept
    # pushing at the hop apex and fed energy into the bounce cycle.
    hover_force_min_leg_fz: 4.0
    attitude_support_enabled: true
    # Re-enabled after the foot_force_sign fix: run24 turned this off
    # while the WBC J^T sign was inverted, i.e. every attitude delta was
    # actively anti-correcting - no conclusion from that A/B survives the
    # sign fix. With correct force delivery the pitch coupling from the
    # saturating hind pair needs this authority (scaled 0.35 in HOVER).
    attitude_support_hover_enabled: true
    attitude_support_hover_scale: 0.35
    attitude_support_roll_target: 0.0
    attitude_support_pitch_target: 0.0
    attitude_support_roll_kp: 90.0
    attitude_support_roll_kd: 20.0
    attitude_support_pitch_kp: 140.0
    attitude_support_pitch_kd: 28.0
    # 28 N: trot recovery authority. The 2-leg phases build ~0.5-1 rad/s of
    # tip rate that the 4-leg overlap must arrest and reverse in ~0.12 s;
    # 18 N (~4 N*m) was marginally too weak and the tip accumulated over
    # 2-3 strides (run47-49). Headroom check: pair share ~59 N + 28 < 95
    # per-leg cap, and 59 - 28 > 0 keeps the opposite foot loaded.
    attitude_support_max_leg_delta: 28.0
    crossing_approach_speed: 0.05
    crossing_forward_assist_enabled: false
    crossing_forward_assist_force_per_leg: 14.0
    crossing_forward_assist_pre_approach_enabled: false
    crossing_force_full_support: false
    # Must stay false: WBC only realizes stance forces on the scheduler's
    # stance legs, so budgeting the body weight over all 4 legs leaves the
    # trunk unsupported during trot (2 x 32 N < 118 N weight).
    flat_force_full_support: false
    # Replaced by the closed-loop walking planar stabilization below.
    flat_forward_assist_enabled: false
    flat_forward_assist_force_per_mps: 300.0
    flat_forward_assist_max_force_per_leg: 35.0
    flat_forward_assist_min_cmd: 0.02
    walking_stabilization_enabled: true
    # N per (m/s) of body-velocity error, split over stance legs. Sized so a
    # 0.1 m/s error commands ~20 N of tangential force on a 12 kg robot.
    # Rebased after foot_force_sign=-1 fix: 200 was tuned against inverted
    # stance torques and over-corrected lateral/yaw once walking stabilized.
    # Tangential authority: must decisively exceed the parasitic drags
    # (swing-PD rubber-band on early-touchdown feet + trot-rock scrub eat
    # ~15-20 N: run57-63 pushed 20 N and stood still; 250/35 walks 0.85 m
    # straight, run64). The tilt fade in applyWalkingPlanarStabilization
    # is what keeps this authority from feeding tip transients (run49).
    walking_vx_kp: 250.0
    walking_vy_kp: 100.0
    walking_wz_kp: 12.0
    walking_fx_max_per_leg: 35.0
    walking_fy_max_per_leg: 22.0
    walking_yaw_moment_max: 6.0
    # Velocity-feedback low-pass (s). Odom velocity is measured at
    # base_link: the trot pitch/roll rock aliases in as vx = h*wy at gait
    # frequency (+-0.12 m/s with zero net motion, run57), and unfiltered
    # feedback spends the whole tangential budget fighting the rock
    # instead of translating the robot.
    walking_vel_filter_tau: 0.35
    # Roll/pitch rate damping through common-mode stance fx/fy (N*m per
    # rad/s). Disabled: the odom angular rate (20 Hz finite difference)
    # spikes at every touchdown, so the damping term saturated its clamp
    # in a noise-driven direction each step and flipped the trunk within
    # the first stride (run41/42). Re-enable only with a filtered IMU
    # rate source.
    walking_rate_damping: 0.0
    walking_rate_force_max: 20.0
    crossing_freeze_rail_targets: false
    bfs_rail_ramp_enabled: true
    bfs_rail_ramp_rate: 0.015
    bfs_rail_ramp_slow_scale: 0.25
    bfs_attitude_gate_roll: 0.30
    bfs_attitude_gate_pitch: 0.25
    bfs_attitude_gate_tilt: 0.40
    bfs_attitude_gate_up_z: 0.85
    bfs_attitude_gate_angular_rate: 1.20
    bfs_min_body_z_for_ramp: 0.080
    bfs_hard_fail_body_z: 0.055
