dog2_gait_scheduler:
  ros__parameters:
    use_sim_time: true
    # The reference video is a slow four-beat crawl, not a diagonal trot.
    # Exactly one foot swings after the body reference has shifted into the
    # remaining support triangle. A foot cannot become stance again until
    # the contact sensor observed both release and touchdown.
    gait: crawl
    # Used by the swing-target node: 1.8 * (1-duty=0.25) = 0.45 s swing.
    # The complete contact-aware four-leg crawl cycle is 4.4 s because each
    # leg also receives a 0.45 s pre-shift and 0.20 s settle window.
    cycle_time: 1.8
    duty_factor: 0.75
    publish_rate: 50.0
    contact_aware: true
    contact_freshness_sec: 0.20
    crawl_pre_shift_sec: 0.45
    crawl_swing_sec: 0.45
    crawl_settle_sec: 0.20
    crawl_max_swing_sec: 1.20
    crawl_body_shift_scale: 0.65
    cmd_vel_topic: /cmd_vel
    contact_phase_topic: /dog2/gait/contact_phase
    gait_command_topic: /dog2/gait/command
    body_shift_topic: /dog2/gait/body_shift
    body_shift_error_topic: /dog2/mpc/body_shift_error
    # MPC publishes zero only after the measured three-foot support solve has
    # positive load on every remaining foot and body motion/tilt has settled;
    # infinity means unloading the encoded upcoming leg is not yet safe.
    body_shift_tolerance_m: 0.016
    shift_error_freshness_sec: 0.20
    foot_contact_topic_lf: /dog2/foot_contact/lf
    foot_contact_topic_lh: /dog2/foot_contact/lh
    foot_contact_topic_rh: /dog2/foot_contact/rh
    foot_contact_topic_rf: /dog2/foot_contact/rf
